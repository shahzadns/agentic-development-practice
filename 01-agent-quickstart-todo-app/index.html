<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Task List</title>
  <style>
    :root{--bg:#f7fafc;--card:#ffffff;--muted:#6b7280;--accent:#2563eb;--danger:#ef4444}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;background:var(--bg);color:#111827;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
    .container{width:100%;max-width:720px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    h1{font-size:1.25rem;margin:0}
    .card{background:var(--card);border-radius:12px;box-shadow:0 6px 18px rgba(15,23,42,0.06);padding:18px}
    form{display:flex;gap:8px}
    input[type=text]{flex:1;padding:12px 14px;border:1px solid #e6e9ee;border-radius:8px;font-size:1rem}
    button{background:var(--accent);color:white;border:none;padding:11px 14px;border-radius:8px;font-weight:600;cursor:pointer}
    button:active{transform:translateY(1px)}
    .controls{display:flex;gap:8px;align-items:center}
    .muted{color:var(--muted);font-size:0.9rem}
    ul.tasks{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
    li.task{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;border:1px solid #f1f5f9}
    label.task-label{flex:1;display:flex;gap:12px;align-items:center;cursor:pointer}
    .task-text{word-break:break-word}
    .task-text.completed{text-decoration:line-through;color:var(--muted)}
    .task.dragging{opacity:0.5}
    .task.drag-over{box-shadow:0 0 0 3px rgba(37,99,235,0.12);}
    .task.placeholder{height:0;padding:0;margin:4px 0;border-top:2px solid rgba(37,99,235,0.7);background:transparent}
    .task.placeholder + .task{margin-top:0}
    .small-btn{background:transparent;border:0;color:var(--muted);cursor:pointer;padding:6px;border-radius:6px}
    .small-btn:hover{background:rgba(15,23,42,0.04)}
    .delete{color:var(--danger)}
    .meta{display:flex;gap:12px;align-items:center;margin-top:12px}
    .empty{padding:20px;text-align:center;color:var(--muted)}
    @media (max-width:520px){body{padding:12px}.card{padding:14px}button{padding:10px 12px}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Task List</h1>
      <div class="muted" id="time">&nbsp;</div>
    </header>

    <section class="card">
      <form id="taskForm" aria-label="Add task">
        <input type="text" id="taskInput" placeholder="Add a new task..." autocomplete="off" required />
        <button type="submit">Add</button>
      </form>

      <div class="meta">
        <div class="muted" id="counts">0 tasks</div>
        <div style="margin-left:auto;display:flex;gap:8px">
          <button class="small-btn" id="clearCompleted">Clear completed</button>
          <button class="small-btn" id="clearAll">Clear all</button>
        </div>
      </div>

      <ul class="tasks" id="tasksList" aria-live="polite"></ul>
      <div id="empty" class="empty" hidden>No tasks yet — add one above.</div>
    </section>

    <p style="text-align:center;margin-top:12px;color:var(--muted);font-size:0.9rem">Tasks are saved in your browser (localStorage).</p>
  </div>

  <script>
    // Simple task list persisted to localStorage
    const STORAGE_KEY = 'taskList.tasks.v1'

    // Utilities
    const $ = (sel) => document.querySelector(sel)
    const taskForm = $('#taskForm')
    const taskInput = $('#taskInput')
    const tasksList = $('#tasksList')
    const counts = $('#counts')
    const empty = $('#empty')
    const clearCompletedBtn = $('#clearCompleted')
    const clearAllBtn = $('#clearAll')
    const timeEl = $('#time')

    function nowText(){
      const d = new Date()
      return d.toLocaleString()
    }
    timeEl.textContent = nowText()
    setInterval(()=>{timeEl.textContent = nowText()}, 60_000)

    function loadTasks(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY)
        if(!raw) return []
        return JSON.parse(raw)
      }catch(e){
        console.error('Failed to load tasks', e)
        return []
      }
    }

    function saveTasks(tasks){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks))
    }

    function uid(){
      return Date.now().toString(36) + Math.random().toString(36).slice(2,8)
    }

    // Placeholder used to show insertion point
    const placeholder = document.createElement('li')
    placeholder.className = 'task placeholder'

    function renderTasks(){
      const tasks = loadTasks()
      tasksList.innerHTML = ''
      if(tasks.length === 0){
        empty.hidden = false
      } else {
        empty.hidden = true
      }

      tasks.forEach(task => {
        const li = document.createElement('li')
        li.className = 'task'
        li.dataset.id = task.id
        li.draggable = true

        li.addEventListener('dragstart', (e) => {
          e.dataTransfer.effectAllowed = 'move'
          try { e.dataTransfer.setData('text/plain', task.id) } catch (err) { /* some browsers may throw */ }
          li.classList.add('dragging')
        })

        li.addEventListener('dragend', () => {
          li.classList.remove('dragging')
          if(placeholder.parentNode) placeholder.parentNode.removeChild(placeholder)
        })

        // compute insert position (before/after) based on cursor Y
        li.addEventListener('dragover', (e) => {
          e.preventDefault()
          const rect = li.getBoundingClientRect()
          const after = (e.clientY - rect.top) > (rect.height / 2)
          if(after){
            if(li.nextSibling !== placeholder) li.parentNode.insertBefore(placeholder, li.nextSibling)
            placeholder.dataset.position = 'after'
            placeholder.dataset.targetId = task.id
          } else {
            if(li.previousSibling !== placeholder) li.parentNode.insertBefore(placeholder, li)
            placeholder.dataset.position = 'before'
            placeholder.dataset.targetId = task.id
          }
        })

        li.addEventListener('dragleave', (e) => {
          // remove placeholder if leaving the list entirely
          const toEl = e.relatedTarget
          if(!toEl || !tasksList.contains(toEl)){
            if(placeholder.parentNode) placeholder.parentNode.removeChild(placeholder)
          }
        })

        li.addEventListener('drop', (e) => {
          e.preventDefault()
          const draggedId = (() => { try { return e.dataTransfer.getData('text/plain') } catch(_) { return null } })()
          if(!draggedId) return
          // determine insertion from the placeholder if present
          let position = null, targetId = null
          if(placeholder.parentNode){
            position = placeholder.dataset.position
            targetId = placeholder.dataset.targetId
            placeholder.parentNode.removeChild(placeholder)
          }
          reorderTasks(draggedId, targetId, position)
        })

        const label = document.createElement('label')
        label.className = 'task-label'

        const checkbox = document.createElement('input')
        checkbox.type = 'checkbox'
        checkbox.checked = !!task.completed
        checkbox.setAttribute('aria-label', 'Mark task complete')
        checkbox.addEventListener('change', () => toggleComplete(task.id))

        const text = document.createElement('span')
        text.className = 'task-text' + (task.completed ? ' completed' : '')
        text.textContent = task.text

        label.appendChild(checkbox)
        label.appendChild(text)

        const buttons = document.createElement('div')

        const del = document.createElement('button')
        del.className = 'small-btn delete'
        del.title = 'Delete task'
        del.setAttribute('aria-label', 'Delete task')
        del.innerHTML = 'Delete'
        del.addEventListener('click', () => deleteTask(task.id))

        buttons.appendChild(del)

        li.appendChild(label)
        li.appendChild(buttons)
        tasksList.appendChild(li)
      })

      updateCounts()
    }

    function updateCounts(){
      const tasks = loadTasks()
      const total = tasks.length
      const remaining = tasks.filter(t=>!t.completed).length
      counts.textContent = `${remaining} remaining • ${total} total`
    }

    function addTask(text){
      if(!text || !text.trim()) return
      const tasks = loadTasks()
      const task = {id: uid(), text: text.trim(), completed: false, createdAt: Date.now()}
      tasks.unshift(task)
      saveTasks(tasks)
      renderTasks()
      taskInput.value = ''
      taskInput.focus()
    }

    function toggleComplete(id){
      const tasks = loadTasks()
      const idx = tasks.findIndex(t=>t.id===id)
      if(idx === -1) return
      tasks[idx].completed = !tasks[idx].completed
      saveTasks(tasks)
      renderTasks()
    }

    function deleteTask(id){
      if(!confirm('Delete this task?')) return
      const tasks = loadTasks().filter(t=>t.id !== id)
      saveTasks(tasks)
      renderTasks()
    }

    function clearCompleted(){
      if(!confirm('Remove all completed tasks?')) return
      const tasks = loadTasks().filter(t=>!t.completed)
      saveTasks(tasks)
      renderTasks()
    }

    function clearAll(){
      if(!confirm('Clear all tasks?')) return
      saveTasks([])
      renderTasks()
    }

    function reorderTasks(draggedId, targetId, position = 'before'){
      const tasks = loadTasks()
      const from = tasks.findIndex(t=>t.id===draggedId)
      if(from === -1) return
      const [item] = tasks.splice(from,1)
      if(!targetId){
        // append to end
        tasks.push(item)
      } else {
        const to = tasks.findIndex(t=>t.id===targetId)
        const insertIndex = to === -1 ? tasks.length : (position === 'after' ? to + 1 : to)
        tasks.splice(insertIndex, 0, item)
      }
      saveTasks(tasks)
      renderTasks()
    }

    // Event bindings
    taskForm.addEventListener('submit', (e) => {
      e.preventDefault()
      addTask(taskInput.value)
    })

    taskInput.addEventListener('keydown', (e) => {
      if(e.key === 'Escape') taskInput.value = ''
    })

    clearCompletedBtn.addEventListener('click', clearCompleted)
    clearAllBtn.addEventListener('click', clearAll)

    // allow dropping on empty list/container to append
    tasksList.addEventListener('dragover', (e) => {
      e.preventDefault()
      // if list is empty or hovering past the last item, show placeholder at end
      const rect = tasksList.getBoundingClientRect()
      const appendAtEnd = e.clientY > rect.bottom - 10
      if(appendAtEnd){
        if(tasksList.lastElementChild !== placeholder) tasksList.appendChild(placeholder)
        placeholder.dataset.position = 'after'
        placeholder.dataset.targetId = ''
      }
    })

    tasksList.addEventListener('drop', (e) => {
      e.preventDefault()
      const draggedId = (() => { try { return e.dataTransfer.getData('text/plain') } catch(_) { return null } })()
      if(!draggedId) return
      if(placeholder.parentNode){
        const position = placeholder.dataset.position
        const targetId = placeholder.dataset.targetId || null
        placeholder.parentNode.removeChild(placeholder)
        reorderTasks(draggedId, targetId, position)
      } else {
        // no placeholder — append
        reorderTasks(draggedId, null, 'after')
      }
    })

    // Initial render
    renderTasks()

    // Expose for console debugging
    window.taskList = {loadTasks, saveTasks, renderTasks, addTask, reorderTasks}
  </script>
</body>
</html>
